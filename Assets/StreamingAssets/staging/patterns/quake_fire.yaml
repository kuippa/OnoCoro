---
# スポーンパターン: 地震連動火災
# Season 3 W1: 再利用可能スポーンパターン（2階層YAML構成の階層1）
# 地震発生 → 建物倒壊 → 倒壊建物から出火、の一連シーケンス。
# スロット: {intensity}=地震の強さ, {break_count}=倒壊建物数
pattern_id: quake_fire
note: "地震連動火災（地震→倒壊→倒壊建物から出火）"
ver: 1.0.0
events:
  - time: 1
    event: earthquake
    value: "{intensity}"
  - time: 2
    event: notice
    value: "地震が発生しました。"
  - time: 3
    event: building_break
    value: "{break_count}"
  - time: 3.5
    event: spawn_unit
    value: FireCube, random_doom_building
  - time: 4.5
    event: spawn_unit
    value: FireCube, random_doom_building
