---
# スポーンパターン: 地震連動火災
# Season 3 W1: 再利用可能スポーンパターン（2階層YAML構成の階層1）
# 地震発生 → 揺れ収束 → 建物倒壊 → 倒壊建物から出火、の一連シーケンス。
# スロット: {intensity}=地震の強さ, {break_count}=倒壊建物数
#
# [NOTE] W2 Task 1 で地震はカメラシェイク方式（ワールド非変位）に変更されたため、
# 揺れ中スポーンの奈落落下制約（BUG-S3-002）は解消済み。
# ただし「揺れ→倒壊→出火」の順序は災害の流れとして自然なので演出上維持する。
pattern_id: quake_fire
note: "地震連動火災（地震→揺れ収束→倒壊→出火）"
ver: 1.1.0
events:
  - time: 1
    event: earthquake
    value: "{intensity}"
  # - time: 2
  #   event: notice
  #   value: "地震が発生しました。"
  - time: 2
    event: subtelop
    value: "大地が揺れている"

  # 倒壊した各建物から出火（出火数＝倒壊数）。旧: building_break + FireCube 2箇所固定
  - time: 4
    event: building_break_fire
    value: "{break_count}"
