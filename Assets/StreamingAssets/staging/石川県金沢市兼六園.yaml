boards:
  # ========================================
  # 1. 基本操作 (プレイヤー操作)
  # ========================================
  
  - code: ReadMeText0
    text: "まずはWASD キーで移動しましょう。\n 立て看板に近づくと自動で文字が見えます。\n 離れるかクリックで消えます。"
  - code: ReadMeText1
    text: "SHIFT 押しながら移動で走ります。マウス で視点移動、マウスホイール で視界調整できます。"
  - code: ReadMeText2
    text: "光るパワーキューブに触れると ポイント が増えます。ユニット作成に使う大切なエネルギーです。SPACE でジャンプ！"
  - code: ReadMeText2_2
    text: "このゲームでは細かいジャンプはむずかしいですね。右側のポイントが増えました。"

  # ========================================
  # 2. ユニット操作 (クリーナー・タワー)
  # ========================================

  - code: ReadMeText3
    text: "虫眼鏡や右クリックで詳細情報が見えるものがあります。"
  - code: ReadMeText4
    text: "ゴミはお掃除ロボットに任せましょう。TAB キーでユニット作成メニューを表示します。"
  - code: ReadMeText4_2
    text: "左上のメニューか１～５の数字キーでユニットを選択し、出現したマーカー位置に呼び出します。"

  - code: Tip_Unit_Types
    text: "ユニットごとに役割があります。ゴミを回収だったり火を消したり。詳細情報で確認しましょう。"
    pos: -246, 32, -75
  - code: Tip_Unit_Selection
    text: "ユニット作成に必要なポイント種別、ユニットが仕事で得るポイントを管理しましょう。"
    pos: -246, 32, -75

  # ========================================
  # 3. 環境・ハザード (マップ危険要素)
  # ========================================
  
  - code: ReadMeText5
    text: "マップの端から落ちないよう注意してください。(バグあり)"

  - code: ReadMeText6
    text: "火の近くのゴミは燃えやすくなります。早めに片付けるか火を消すユニットを使いましょう。"
  - code: ReadMeText7
    text: "灰になると回収できません。燃える前に対処することが大事です。"
  - code: ReadMeText8
    text: "ステージによっては水害や地震などの災害が発生します。対策をして被害を抑えましょう。"


  # ========================================
  # 4. ゴール・建物修復 (ステージクリア条件)
  # ========================================
  
  - code: ReadMeText9
    text: "このステージのゴールは建物をすべて修復することです。ステージによってゴールは異なります。"
  - code: ReadMeText10
    text: "虫眼鏡 で建物を確認して、修復ボタンを押して直しましょう。"
  - code: ReadMeText11
    text: "建物は壊れるとき破片をゴミとして放出します。建物の大きさによって必要な修復ポイントも変わります。"

  # ========================================
  # 5. その他 (ゲーム要素・実装状況)
  # ========================================
  
  - code: ReadMeText12
    text: "ここの装飾はまだゲーム機能を持ちません。将来の更新をお楽しみに。"

  - code: Note_Other_Future
    text: "F2キーで一時停止、F3キーで等速、F4キーで2倍速、F5キーで20倍速に時間操作できます。"
    pos: -246, 32, -75

  - code: Note_ESC
    text: "ESC キーでゲームメニューを開いて、ゲームを一時停止できます。終了もこちらから。"
    pos: -246, 32, -75


  - code: Test
    text: "存在しないcodeを設置するテスト"
    pos: -246, 32, -75



