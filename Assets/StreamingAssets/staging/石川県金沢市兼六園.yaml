boards:
  # ========================================
  # 1. 基本操作 (プレイヤー操作)
  # ========================================
  
  - code: ReadMeText0
    text: "まずはWASD キーで移動しましょう。\n 立て看板に近づくと表示されます。\n 離れるかクリックで消えます。"
  - code: ReadMeText1
    text: "SHIFT 押しながら移動で走ります。\n マウス で視点移動 \n マウスホイール で視界調整できます。"
  - code: ReadMeText2
    text: "光るパワーキューブに触れると ポイント が増えます。\n ユニット作成に使う大切なエネルギーです。\n ２種類のポイントが右上に表示されています。 \n SPACE でジャンプ！"
  - code: ReadMeText2_2
    text: "大ジャンプでしたね！ \n このゲームでは細かいジャンプをつかうことはありません \n パワーキューブでユニット作成に必要なポイントが増えました。"

  # ========================================
  # 2. ユニット操作 (クリーナー・タワー)
  # ========================================

  - code: ReadMeText3
    text: "虫眼鏡や右クリックで詳細情報が読めるものがあります。\n 虫眼鏡は画面左上アイテム欄にあります。 \n まわりにちらばったゴミの情報を確認してみましょう。"
  - code: ReadMeText4
    text: "ゴミはお掃除ロボットに任せましょう。\n TAB キーでユニット作成メニューを表示し、お掃除ユニット Sweeperを作成してください。 \n ＜＞でページを切り替え、ビルドボタンでユニットを作成します。 \n TAB キーでユニット作成メニューを閉じます。"
  - code: ReadMeText4_2
    text: "作成したユニットはアイテムストックされます。\n左上のメニューか１～５の数字キーで選択してください。 \n 出現したマーカーをクリックするとその位置に呼び出します。 \n マウスホイールで向きを調整できます。 \n 呼び出したユニットが活躍するとポイントを得られます。"

  # ========================================
  # 3. 環境・ハザード (マップ危険要素)
  # ========================================
  
  - code: ReadMeText5
    text: "マップの端から落ちないよう注意してください。(バグあり)"

  - code: ReadMeText6
    text: "火の近くのゴミは燃えることがあります。火事を放置すると、延焼範囲が広がったり、火の勢いが強くなったりします。 \n 火事は建物にも燃え移ります。建物が燃えると修復に必要なポイントが不足するかもしれません。"
  - code: ReadMeText7
    text: "灰になると ポイントを回収できません。燃え尽きる前に対処することが大事です。早めに片付けるか火を消すユニット WaterTurret を使いましょう。 \n 火を消すユニットはTABキーで作成できます。 \n 火の勢いによっては複数台の WaterTurret が必要になることがあります。 \n 放水した水は流れてしまうので打ち出しの向きを工夫すると効果的です。"
  
  - code: ReadMeText8
    text: "ステージによっては天気が変わることがあります。水害や地震などの災害が発生します。対策をして被害を抑えましょう。 \n 現時点において雨では消火できません。"


  # ========================================
  # 4. ゴール・建物修復 (ステージクリア条件)
  # ========================================
  
  - code: ReadMeText9
    text: "このステージのゴールは建物をすべて修復することです。ステージによってゴールは異なります。"
  - code: ReadMeText10
    text: "虫眼鏡 で建物を確認して、修復ボタンを押して直しましょう。"
  - code: ReadMeText11
    text: "建物は壊れるとき破片をゴミとして放出します。建物の大きさによって必要な修復ポイントも変わります。"

  # ========================================
  # 5. その他 (ゲーム要素・実装状況)
  # ========================================
  
  - code: ReadMeText12
    text: "ここの装飾はまだゲーム機能を持ちません。将来の更新をお楽しみに。"

  - code: Note_Other_Future
    text: "F2キーで一時停止、F3キーで等速、F4キーで2倍速、F5キーで20倍速に時間操作できます。"
    pos: -246, 32, -75

  - code: Note_ESC
    text: "ESC キーでゲームメニューを開いて、ゲームを一時停止できます。終了もこちらから。"
    pos: -246, 32, -75


