  - name: 三鷹井の頭
    note: "三鷹井の頭"
    BIT: 6000
    CLK: 6100
itemlists:
  # - item: FireCube  # 火事
  # - item: Litter  # フココロえもん ごみを巻き散らかす   アイテムではない敵ユニイットなので呼び出せない
  - item: DustBox  # ごみ箱
  - item: SentryGuard  # 監視員
  - item: Sweeper
  - item: GarbageCube
  - item: GarbageCubeBox
  - item: PowerCube
  # - item: StopPlate # 止水板
  # - item: WaterTurret # 消火

pathmakers:

  # 敵スポーン地点：
  - name: start_iseya_mae
    pos: 201, auto, 34.5   


  # 敵スポーン地点：プレイヤーの北側（Z が大きい値）
  - name: path_marker_start2
    pos: 0, auto, 160   # Y を auto に → コード側で地面検出

  # 中間地点 1：北からプレイヤーに向かう途中
  - name: path_marker_03
    pos: -1.8, auto, 155   # プレイヤー方向へ少し南寄り

  # 中間地点 2：プレイヤーの近く
  - name: path_marker_04
    pos: -1.8, auto, 145   # プレイヤーすぐ北側

  # ゴール地点：プレイヤーの南側
  - name: path_marker_goal2
    pos: 0, auto, 135   # プレイヤーの南側（Z = 135）、X は同じ

  # - name: path_marker_02  # すでに定義済のマーカーは位置のみ変更
  #   pos: 9, 0, 15

goals:
  # - building: repair_all
  # - garbage: 10, 20  # ゴミの数がｘを超えずｙ秒経過したらステージクリア
  - notfailtime: 300  # ゲームオーバーせずにｙ秒経過したらステージクリア

gameovers:
  # - garbage: 60  # ゴミの数がｘを超えたらゲームオーバー
  # - building: repair_all
  - gameover_type: GarbageOverflow
    threshold: 50   # ごみが 50 個を超えたらゲームオーバー

events:
  # ========== 環境設定 ==========
  - time: 0
    event: weather
    value: sunny, 0.00, 0.25, 500

  - time: 0
    event: wind
    value: 1, 0

  # ========== テロップ ==========

  - time: 1
    event: telop
    value: "三鷹井の頭"

  - time: 1
    event: subtelop
    value: "ごみを60以下に保ち、5分間耐え抜こう！"


  # ========== Path 1: 南西ルート ==========
  # 敵パス表示開始
  - time: 1
    event: bloom_path
    value: path_marker_start2, path_marker_03, path_marker_04, path_marker_goal2
    # value: path_marker_start2, path_marker_goal2

  # ========== Wave 1（0-25秒）: 準備フェーズ ==========
  # 【目的】敵が少なく、プレイヤーがタワー配置に慣れる

  # Wave 1-1: 最初の 1 体（敵が見えて安心感を）
