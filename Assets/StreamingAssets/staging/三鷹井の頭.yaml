---
stagename: 三鷹井の頭
stagenotice: "三鷹井の頭"
stageid: 三鷹井の頭
ver: 1.0.0 # 2025/4/18 
stages:
  - name: 三鷹井の頭
    note: "三鷹井の頭"
    BIT: 6000
    CLK: 6100
itemlists:
  - item: FireCube  # 火事
  # - item: Litter  # フココロえもん ごみを巻き散らかす   アイテムではない敵ユニイットなので呼び出せない
  - item: DustBox  # ごみ箱
  - item: SentryGuard  # 監視員
  - item: Sweeper
  - item: GarbageCube
  - item: GarbageCubeBox
  - item: PowerCube
  # - item: StopPlate # 止水板
  # - item: WaterTurret # 消火

pathmakers:
  - name: path_marker_start_1
    pos: 0, auto, 160   # Y を auto に → コード側で地面検出

  - name: path_marker_1
    pos: 5.7, auto, 143   # プレイヤー方向へ少し南寄り

  - name: path_marker_goal_1
    pos: 0, auto, 135   # プレイヤーの南側（Z = 135）、X は同じ

  - name: start_iseya_mae
    # pos: 201, auto, 34.5   
    pos: 20, auto, 160

  - name: path_marker_2
    # pos: 100, auto, 70
    pos: 7, auto, 130

  # - name: path_marker_02  # すでに定義済のマーカーは位置のみ変更
  #   pos: 9, 0, 15

routenames:  # 
  - name: route_wave1
    markers: path_marker_start_1, path_marker_1, path_marker_goal_1
  
  - name: route_wave2
    markers: start_iseya_mae, path_marker_2, path_marker_goal_1


goals:
  # - building: repair_all
  # - garbage: 10, 20  # ゴミの数がｘを超えずｙ秒経過したらステージクリア
  - notfailtime: 300  # ゲームオーバーせずにｙ秒経過したらステージクリア

gameovers:
  # - garbage: 60  # ゴミの数がｘを超えたらゲームオーバー
  # - building: repair_all
  - gameover_type: GarbageOverflow
    threshold: 360   # ごみが規定数を超えたらゲームオーバー

events:
  # ========== 環境設定 ==========
  - time: 0
    event: weather
    value: sunny, 0.00, 0.25, 500

  - time: 0
    event: wind
    value: 1, 0

  # ========== テロップ ==========

  - time: 1
    event: telop
    value: "三鷹井の頭"

  - time: 1
    event: subtelop
    value: "ごみを60以下に保ち、5分間耐え抜こう！"


  # ========== 補給 ==========
  - time: 1
    event: spawn_unit
    value: PowerCube, -2, auto, 155, 15

  - time: 1
    event: spawn_unit
    value: PowerCube, -2, auto, 165, 1500


  # ========== Wave 1（0-25秒）==========
  - time: 1
    event: bloom_path
    value: path_marker_start_1, path_marker_1, path_marker_goal_1

  - time: 5
    event: subtelop
    value: "wave 1"

  - time: 5
    event: spawn_enemy_unit
    value: Litter, path_marker_start_1, path_marker_1, path_marker_goal_1

  - time: 8
    event: spawn_enemy_unit
    value: Litter, route_wave1

  - time: 17
    event: spawn_enemy_unit
    value: Litter, path_marker_start_1, path_marker_1, path_marker_goal_1

  - time: 21
