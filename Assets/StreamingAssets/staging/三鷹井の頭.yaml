  - time: 30
    event: off_bloom_path
    value: path_marker_start_1, path_marker_1, path_marker_goal_1


  # ========== 桜咲く ==========

  - time: 30
    event: bloom_sakura
    value: TreeSakura_01

  - time: 30
    event: spawn_unit
    value: PowerCube, -5, auto, 140, 30

  # ========== Wave 2（30-60秒）==========
  - time: 30
    event: bloom_path
    value: start_iseya_mae, path_marker_2, path_marker_goal_1

  - time: 30
    event: subtelop
    value: "wave 2"

  - time: 30
    event: spawn_enemy_unit
    value: Litter, start_iseya_mae, path_marker_2, path_marker_goal_1

  - time: 33
