---
# 防災施策のバランス調整ファイル（Season 3 W3 Task4・教育重視）
#
# ここを編集すれば再コンパイルなしで施策のコスト・効果範囲・鎮火力を調整できます。
# 値を変えて Unity を再生し直すだけで反映されます（コンパイル不要）。
#
#   type   : 施策の種類（Hydrant=消火栓 / Cistern=防火水槽 / Plaza=避難広場）
#   cost   : 配置コスト（BIT ポイント）
#   radius : 効果半径[m]（この範囲内の火災に効く）
#   power  : 1秒あたりの鎮火力（0.0～1.0。大きいほど速く火を消す。Plaza は 0=効果なし）
#
# 調整の指針（教育重視）: 「考えて投資すれば被害が目に見えて減る」が成立する範囲で、
# 適当に置くと足りない/高すぎる、くらいの歯ごたえに収める。
infrastructures:
  - type: Hydrant      # 消火栓: 狭くて安い「点消火」
    cost: 50
    radius: 30
    power: 0.25
  - type: Cistern      # 防火水槽: 広くて高い「面の抑制」
    cost: 120
    radius: 70
    power: 0.06
  - type: Plaza        # 避難広場: 現在は配置メニュー外（参考値）
    cost: 100
    radius: 50
    power: 0
