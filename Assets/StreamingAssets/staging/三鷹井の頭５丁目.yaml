---
# 三鷹井の頭５丁目 - 防災投資シミュレーション ワークショップ用小マップ（Season 3 W2）
#
# Year 1: 地震カメラシェイク → 倒壊 3 棟 → 出火
# Year 2: 規模拡大（倒壊 5 棟）
# Year 3: 多重編成（本震 + 余震）
# 施策（Hydrant / Cistern / Plaza）はプレイヤーが配置フェーズ中に
# TAB ビルドメニューから配置する（2026-06-13 W2 Task 4/5 検証完了に伴い
# 動作確認用の自動配置イベントを削除済み）。
stagename: 三鷹井の頭５丁目
stagenotice: "木密地域 防災投資シミュレーション（小マップ）"
stageid: MitakaInokashira5
ver: 1.1.0 # 2026/6/12 Season 3 W2
stages:
  - name: 三鷹井の頭５丁目
    note: "3年間の防災投資で住宅地の火災被害を抑えよう"
    BIT: 600
    CLK: 600
itemlists:
  # - item: FireCube      # 火事（敵）
  - item: WaterTurret   # 消火器（従来ユニット・比較用）
  # - item: Sweeper       # お掃除ロボット
  - item: Hydrant       # 消火栓（施策・統計効果型）
  - item: Cistern       # 防火水槽（施策・統計効果型）
  # - item: Plaza       # 避難広場: ゲーム上の意味が未確定のため一旦外す（W3 Task4・後で再検討）

# ===== 解体廃棄物の係数（CityHack 2026）=====
# 建物種別ごとに、解体で出る廃棄物量と画面上の瓦礫の量を調整する。
#   type           : 建物種別（wood=木造 / steel=鉄骨造 / concrete=RC・SRC造 / unknown=不明）
#   tons_per_sqm   : 延床面積 1 ㎡あたりの発生量[t]  ※ 仮の値。パートナーの実務値で差し替える
#   debris_per_ton : 廃棄物 1t あたりの瓦礫の量（見た目だけに効く）
#   max_cubes      : 1 棟あたりの瓦礫キューブ数の上限（物理負荷の安全弁）
#   noncombustible_ratio : 廃棄物のうち不燃物が占める割合(0.0〜1.0)
#                          コンクリートがら・金属など燃やせないもの。
#                          可燃と不燃は処理先も費用も異なるため分けて数える。
#                          [仮の値] PLATEAU 技術資料 plateau_tech_doc_0015 の
#                          P43 以降にある組成比で差し替える予定
#
# [重要] つまみの役割を分けてある。混ぜて使うと数字か見た目のどちらかが壊れる。
#   ・トラック台数など「発表で出す数字」を変えたい → tons_per_sqm
#   ・画面の瓦礫を増やしたいだけ                   → debris_per_ton と max_cubes
# tons_per_sqm を見た目のために盛ると、廃棄物量とトラック台数まで一緒に嘘になる。
#
# [注意] max_cubes に達すると、tons_per_sqm や debris_per_ton をいくら増やしても
#   見た目は変わらない（頭打ちになる）。打ち切り時は Console に警告が出る。
#   増やすほど Rigidbody が増えて重くなるので、上げるときは実機で fps を確認すること。
#
# ※ 建物種別は PLATEAU の耐火構造種別・階数・用途地域から推定している
#   （三鷹市データには建物構造そのものが無いため）
# demolition:
#   - type: wood        # 木造
#     tons_per_sqm: 0.5     # 延床1㎡あたりの発生量[t]（パートナー値で差し替え予定）
#     debris_per_ton: 200   # 見た目の瓦礫量（増やすほど多く散らばる）
#     max_cubes: 2000       # 1棟あたりのキューブ数上限
#     noncombustible_ratio: 0.4   # 不燃物の割合（木くず中心なので可燃寄り）
#   - type: steel       # 鉄骨造(S)
#     tons_per_sqm: 0.7
#     debris_per_ton: 200
#     max_cubes: 2000
#     noncombustible_ratio: 0.7   # 不燃物の割合（鉄骨・金属くずが多い）
#   - type: concrete    # RC / SRC 造
#     tons_per_sqm: 1.1
#     debris_per_ton: 200
#     max_cubes: 2000
#     noncombustible_ratio: 0.9   # 不燃物の割合（コンクリートがら中心でほぼ不燃）
#   - type: unknown     # 不明
#     tons_per_sqm: 0.6
#     debris_per_ton: 200
#     max_cubes: 2000
#     noncombustible_ratio: 0.6   # 不燃物の割合（中間値）

# goals / gameovers は定義しない（3年完走がシミュレーション終了条件）

# 年に依存しない初期設定イベント（ステージ開始時に1回だけ実行）
events:
  - time: 0
    event: weather
    value: sunny, 0.00, 0.25, 500  # 天候タイプ, 雨の強さ0~1, 雲の強さ0~1, 霧の視界
  - time: 0
    event: wind
    value: 6, 340  # 風速, 風向き(0~360) 北北西・東京冬季の卓越風向
  # ゲーム目的を明示（開始時に何をすればよいか）＋ オレンジの意味を説明
  - time: 1
    event: telop
    value: "地震火災から街を守ろう（全3年）"
  - time: 1
    event: subtelop
    value: "オレンジの建物が出火点。防災装置を置いて延焼を食い止めよう"

  # ===== CityHack 2026 解体テスト用（試すときだけコメントを外す）=====
  # building_demolish: 建物を N 棟解体して更地化し、
  # 「延床面積 × 構造別の発生原単位」で算定した瓦礫を跡地に散布する。
  # value に "all" を指定すると全建物を解体（重いので注意）。
  # Console に [Demolition] と 4t トラック換算のサマリーが出る。
  # - time: 5
  #   event: building_demolish
  #   value: "3"

# [W3 Task 4] baseline = 消火なし時の想定火災延焼棟数（防いだ延焼=baseline-実延焼）。
# 2026-06-18 各種修正後の消火なし実走で再採取して更新（4/3/6）。
#   ※ 出火位置の perimeter 化・未倒壊優先などの修正で延焼ダイナミクスが変わり、
#     特に Year3 が旧26→6 に激減。旧値(3/8/26)は過大だったため差し替え。
# 出火位置・延焼には乱数/物理が絡むため run ごとに多少ぶれる。必要なら複数走の平均で更新。
# 未指定の年は K×地震倒壊数（K=3）にフォールバックする。
years:
  - year: 1
    duration: 60
    note: "中規模地震と出火。消火栓の鎮火効果を観察する"
    baseline: 4
    schedule:
      - pattern: quake_fire
        at: 3              # 地震 t=4, 倒壊 t=10, 出火 t=11/12
        intensity: "1.6"
        break_count: "3"
    events:
      - time: 1
        event: telop
        value: "Year 1: 地震発生。倒壊建物から出火"

  - year: 2
    duration: 90
    note: "規模拡大。防火水槽（広範囲・弱効果）と比較する"
    baseline: 3
    schedule:
      - pattern: quake_fire
        at: 3
        intensity: "1.8"
        break_count: "5"
    events:
      - time: 1
        event: telop
        value: "Year 2: 揺れが強くなった"

  - year: 3
    duration: 90
    note: "本震+余震の多重編成。避難広場の投資記録を確認する"
    baseline: 6
    schedule:
      - pattern: quake_fire
        at: 3
        intensity: "2.0"
        break_count: "7"
      - pattern: quake_fire
        at: 45             # 余震
        intensity: "1.5"
        break_count: "3"
    events:
      - time: 1
        event: telop
        value: "Year 3: 大地震と余震の年"
