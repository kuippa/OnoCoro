---
# 三鷹井の頭５丁目 - 防災投資シミュレーション ワークショップ用小マップ（Season 3 W2）
#
# W2 の一連の動作確認を 1 ステージで行えるイベント構成：
#   Year 1: 地震カメラシェイク → 倒壊 → 出火 → 消火栓の自動配置で鎮火を観察
#   Year 2: 規模拡大 + 防火水槽（広範囲・弱効果）の比較観察
#   Year 3: 多重編成（本震+余震） + 避難広場（投資記録のみ）の台帳確認
# 施策はまだ UI 配置（W2 Task 4）が無いため、動作確認用に spawn_unit イベントで
# random_doom_building（倒壊建物のそば）へ自動配置している。
# UI 実装後はこの自動配置イベントを削除してプレイヤー配置に置き換える。
stagename: 三鷹井の頭５丁目
stagenotice: "木密地域 防災投資シミュレーション（小マップ）"
stageid: MitakaInokashira5
ver: 1.1.0 # 2026/6/12 Season 3 W2
stages:
  - name: 三鷹井の頭５丁目
    note: "3年間の防災投資で住宅地の火災被害を抑えよう"
    BIT: 5000
    CLK: 5000
itemlists:
  - item: FireCube      # 火事（敵）
  - item: WaterTurret   # 消火器（従来ユニット・比較用）
  - item: Sweeper       # お掃除ロボット
  - item: Hydrant       # 消火栓（施策・統計効果型）
  - item: Cistern       # 防火水槽（施策・統計効果型）
  - item: Plaza         # 避難広場（施策・記録のみ）

# goals / gameovers は定義しない（3年完走がシミュレーション終了条件）

# 年に依存しない初期設定イベント（ステージ開始時に1回だけ実行）
events:
  - time: 0
    event: weather
    value: sunny, 0.00, 0.25, 500  # 天候タイプ, 雨の強さ0~1, 雲の強さ0~1, 霧の視界
  - time: 0
    event: wind
    value: 6, 340  # 風速, 風向き(0~360) 北北西・東京冬季の卓越風向
  - time: 1
    event: telop
    value: "三鷹井の頭５丁目（防災投資シミュレーション）"
  - time: 1
    event: subtelop
    value: "3年間の投資で被害を最小化しよう"

years:
  - year: 1
    duration: 75
    note: "中規模地震と出火。消火栓の鎮火効果を観察する"
    schedule:
      - pattern: quake_fire
        at: 3              # 地震 t=4, 倒壊 t=10, 出火 t=11/12
        intensity: "1.6"
        break_count: "3"
    events:
      - time: 1
        event: telop
        value: "Year 1: 地震発生。倒壊建物から出火"
      - time: 20
        event: notice
        value: "（動作確認）消火栓を倒壊建物のそばに自動配置します"
      - time: 21
        event: spawn_unit
        value: Hydrant, random_doom_building
      - time: 22
        event: spawn_unit
        value: Hydrant, random_doom_building

  - year: 2
    duration: 90
    note: "規模拡大。防火水槽（広範囲・弱効果）と比較する"
    schedule:
      - pattern: quake_fire
        at: 3
        intensity: "1.8"
        break_count: "5"
    events:
      - time: 1
        event: telop
        value: "Year 2: 揺れが強くなった"
      - time: 20
        event: notice
        value: "（動作確認）防火水槽を自動配置します"
      - time: 21
        event: spawn_unit
        value: Cistern, random_doom_building
      - time: 22
        event: spawn_unit
        value: Cistern, random_doom_building

  - year: 3
    duration: 90
    note: "本震+余震の多重編成。避難広場の投資記録を確認する"
    schedule:
      - pattern: quake_fire
        at: 3
        intensity: "2.0"
        break_count: "7"
      - pattern: quake_fire
        at: 45             # 余震
        intensity: "1.5"
        break_count: "3"
    events:
      - time: 1
        event: telop
        value: "Year 3: 大地震と余震の年"
      - time: 25
        event: spawn_unit
        value: Plaza, random_doom_building
      - time: 26
        event: notice
        value: "（動作確認）避難広場を配置。投資台帳ログを確認"
