---
# 京都舞鶴 - 解体廃棄物シミュレーション（PLATEAU CityHack 2026）
#
# 三鷹井の頭５丁目.yaml をベースにした基本構成。
# 地震→倒壊→出火が起き、プレイヤーは防災投資で被害を抑える。
# CityHack のデモとしては、建物を解体して廃棄物量を 4t トラック換算で見せる。
#
# [構成] 3〜5 分のデモに収めるため 1 年のみ有効。year 2/3 はコメントアウトしてある。
# 内容は今後調整する。戻すときは years 配下のコメントを外すだけでよい。
#
# [デモの流れ]（プレゼン動画の絵コンテに対応。year 1 の events で組んでいる）
#   t=3〜10  高潮で潮位上昇 → 低地の建物が浸水して倒壊（内水氾濫の可視化に見せる）
#   t=13〜21 地震 → 倒壊 → 出火（瓦礫が放出される）
#   t=26〜34 海から巨大猫が出現し、通り道の建物を解体していく
#   リザルト  廃材を可燃/不燃に分けて 4t トラック換算で表示し、実用性で締める
#
# [このマップの特徴]
# 舞鶴は港湾都市で、三鷹（内陸・木密住宅地）とは災害の性格が異なる。
#   建物  7928 棟（三鷹井の頭５丁目の約 5.4 倍。重いので break_count は控えめ）
#   tnm_  津波浸水想定区域（三鷹には無い）
#   lsld_ 土砂災害警戒区域（三鷹には無い）
#   fld_  洪水浸水想定区域 / urf_ 都市計画区域
# 津波・土砂災害に対応するイベントは未実装のため、本 YAML では扱っていない。
#
# [未調整] BIT/CLK と baseline は三鷹の値からマップ規模で見積もった暫定値。
# 実際にプレイして調整すること（調整手順は三鷹井の頭５丁目.yaml の履歴を参照）。
stagename: 京都舞鶴
stagenotice: "港湾都市 解体廃棄物シミュレーション"
stageid: KyotoMaizuru
ver: 0.1.0 # 2026/8/29 CityHack 2026 初版
stages:
  - name: 京都舞鶴
    note: "建物の解体で出る廃棄物量を可視化する"
    # 三鷹（小マップ・1456棟）が 600/600。棟数比ほどは増やさず 2 倍から様子を見る
    BIT: 1200
    CLK: 1200
itemlists:
  - item: WaterTurret   # 消火器（従来ユニット・比較用）
  - item: Hydrant       # 消火栓（施策・統計効果型）
  - item: Cistern       # 防火水槽（施策・統計効果型）

# ===== 巨大猫の移動経路（CityHack 2026）=====
# [暫定] 座標はシーンに置かれていた EnemyCat の位置(151, 10, -235)を起点に、
# そこから北東へ 3 点を機械的に並べただけのもの。道に沿ってはいない。
# Unity 上でマーカーを掴んで動かせば、その位置が優先される
# （同名マーカーが既にシーンにある場合、YAML は位置のみ更新する仕様）。
#
# Y は auto にしてあるので、地面の高さは Raycast で自動検出される。
# 舞鶴は起伏があるため、手で数値を入れるより auto のままが安全。
pathmakers:
  - name: path_marker_start
    pos: 131, auto, -235     # 猫の出発点

  - name: path_marker_01
    pos: 89, auto, -164     # 中間地点

  - name: path_marker_goal
    pos: 210, auto, -150     # ゴール（ここに着くと猫は消える）

# ===== 解体廃棄物の係数（CityHack 2026）=====
# 建物種別ごとに、解体で出る廃棄物量と画面上の瓦礫の量を調整する。
#   type           : 建物種別（wood=木造 / steel=鉄骨造 / concrete=RC・SRC造 / unknown=不明）
#   tons_per_sqm   : 延床面積 1 ㎡あたりの発生量[t]
#   debris_per_ton : 廃棄物 1t あたりの瓦礫の量（見た目だけに効く）
#   max_cubes      : 1 棟あたりの瓦礫キューブ数の上限（物理負荷の安全弁）
#   noncombustible_ratio : 廃棄物のうち不燃物が占める割合(0.0〜1.0)
#                          コンクリートがら・金属など燃やせないもの。
#                          可燃と不燃は処理先も費用も異なるため分けて数える。
#
# [出典] 原単位・組成比は PLATEAU 技術資料 plateau_tech_doc_0015
#   「5.7 災害廃棄物発生量の採用原単位」の値を採用（2026-08-29 反映）。
#   横浜市災害廃棄物処理計画／環境省 災害廃棄物対策指針 技術資料に準拠。
#     木造 0.6 t/㎡ ・ 非木造 1.0 t/㎡ ・ 焼失 0.23 t/㎡
#     種類別割合は木造・非木造とも 可燃 11% / 不燃 89%
#   木造でも不燃が 89% を占めるのは、重量比ではコンクリート殻・基礎・土砂が
#   支配的なため。見た目の体積比とは一致しない。
#
# [未対応] 焼失（0.23 t/㎡・不燃 99.9%）は被害要因別の区分。
#   本システムは構造別のみで判定しているため、火災倒壊した建物には未適用
#
# [重要] つまみの役割を分けてある。混ぜて使うと数字か見た目のどちらかが壊れる。
#   ・トラック台数など「発表で出す数字」を変えたい → tons_per_sqm
#   ・画面の瓦礫を増やしたいだけ                   → debris_per_ton と max_cubes
# tons_per_sqm を見た目のために盛ると、廃棄物量とトラック台数まで一緒に嘘になる。
#
# [注意] max_cubes に達すると、tons_per_sqm や debris_per_ton をいくら増やしても
#   見た目は変わらない（頭打ちになる）。打ち切り時は Console に警告が出る。
#
# [負荷] 2026/8/29 時点で、三鷹（1456棟）では debris_per_ton: 200 / max_cubes: 2000 が
#   1 フレームのスポーン負荷としてマシン性能に達したため既定値へ戻している。
#   舞鶴は建物が約 5.4 倍あるので、ここは控えめな 50 / 1000（コード側の既定と同値）で始める。
#   上げるときは 1 棟ずつ手動解体して fps を見ながらにすること。
#
# ※ 建物種別は PLATEAU の耐火構造種別・階数・用途地域から推定している
demolition:
  - type: wood        # 木造
    tons_per_sqm: 0.6     # 木造の原単位（技術資料の採用値）
    debris_per_ton: 50    # 見た目の瓦礫量（増やすほど多く散らばる）
    max_cubes: 1000       # 1棟あたりのキューブ数上限
    noncombustible_ratio: 0.89   # 可燃11% / 不燃89%
  - type: steel       # 鉄骨造(S) → 非木造として扱う
    tons_per_sqm: 1.0
    debris_per_ton: 50
    max_cubes: 1000
    noncombustible_ratio: 0.89
  - type: concrete    # RC / SRC 造 → 非木造として扱う
    tons_per_sqm: 1.0
    debris_per_ton: 50
    max_cubes: 1000
    noncombustible_ratio: 0.89
  - type: unknown     # 不明（住宅地が多いので木造相当を採用）
    tons_per_sqm: 0.6
    debris_per_ton: 50
    max_cubes: 1000
    noncombustible_ratio: 0.89

# ===== 浸水による建物被害（CityHack 2026）=====
# 水面より depth(m) 以上深く沈んだ建物を、duration 秒続いたら倒壊させる。
# 倒壊処理は building_break と同じ（新しい壊し方は作っていない）。
#
# [重要] max_breaks_per_second は負荷の安全弁。舞鶴は 7928 棟あるため、
#   潮位を大きく上げると数百棟が同時に条件を満たす。上限が無いと固まる。
#   じわじわ壊れていく絵になるので演出としても都合がよい。
#
# このセクションが無いステージでは浸水判定そのものが動かない。
flood:
  - depth: 0.5                  # 水面からこの深さ(m)より下に底面があれば水没
    duration: 3.0               # 水没がこの秒数続いたら倒壊
    max_breaks_per_second: 5    # 1秒あたりの倒壊上限

# goals / gameovers は定義しない（全年の完走がシミュレーション終了条件）

# 年に依存しない初期設定イベント（ステージ開始時に1回だけ実行）
events:
  - time: 0
    event: weather
    value: sunny, 0.00, 0.30, 500  # 天候タイプ, 雨の強さ0~1, 雲の強さ0~1, 霧の視界
  - time: 0
    event: wind
    value: 7, 300  # 風速, 風向き(0~360) 西北西・日本海側の冬季卓越風向

  # 海面の初期高さ（ベースライン）。
  # [注意] watersurface イベントは親ホルダー（Ocean/River などを束ねる箱）を
  #   動かすもので、海面の高さではない。海面を動かすのは ocean イベント。
  #   舞鶴のシーン初期値は 親Y=6.97 ・ Ocean localY=-6.25 で、実際の海面は 0.72。
  #   ocean はワールド Y をそのまま指定する。
  #     value: 高さ                → 高さだけ変える
  #     value: 高さ, R, G, B       → 海面の色も変える（各0〜1）
  - time: 0
    event: ocean
    value: 0.7
  # - time: 1
  #   event: telop
  #   value: "地震火災から街を守ろう"
  # - time: 1
  #   event: subtelop
  #   value: "オレンジの建物が出火点。防災装置を置いて延焼を食い止めよう"

  # ===== CityHack 2026 解体デモ用（試すときだけコメントを外す）=====
  # building_demolish: 建物を N 棟解体して更地化し、
  # 「延床面積 × 構造別の発生原単位」で算定した瓦礫を跡地に散布する。
  # Console に [Demolition] と 4t トラック換算のサマリーが出る。
  # [注意] value: "all" は 7928 棟が対象になり確実に固まるので、このマップでは使わないこと。
  # - time: 5
  #   event: building_demolish
  #   value: "3"


# baseline = 消火なし時の想定火災延焼棟数（防いだ延焼 = baseline - 実延焼）。
# [未計測] 下記は三鷹の値をそのまま置いた暫定値。
# 消火ユニットを一切置かずに完走し、実際の延焼棟数で置き換えること。
# 未指定の年は K×地震倒壊数（K=3）にフォールバックする。
years:
  - year: 1
    duration: 150
    note: "高潮 → 地震火災 → 巨大猫。プレゼン動画用の一本道構成"
    baseline: 4
    schedule:
      # 高潮の浸水を先に見せてから地震を起こす（絵コンテの順序）
      - pattern: quake_fire
        at: 12             # 地震 t=13, 倒壊 t=19, 出火 t=20/21
        intensity: "1.6"
        break_count: "3"
    events:
      - time: 1
        event: telop
        value: "Year 1: 高潮が押し寄せる"

      # --- 導入: 潮位を上げて低地から浸水させる ---
      - time: 3
        event: subtelop
        value: "高潮警報。低地の建物が浸水しています"
      - time: 4
        event: ocean
        value: 3.0
      - time: 10
        event: ocean
        value: 6.0

      # --- 中盤: 地震と火災（quake_fire パターンが at:3 で発火）---

      # --- 終盤: 海から巨大猫が現れて建物を解体していく ---
      - time: 26
        event: bloom_path
        value: path_marker_start, path_marker_01, path_marker_goal
      - time: 28
        event: telop
        value: "海から巨大な影が…"
      - time: 30
        event: spawn_enemy_unit
        value: Cat, path_marker_start, path_marker_01, path_marker_goal
      - time: 32
        event: subtelop
        value: "通り道の建物が次々と解体されていく"

      # 海面を毒々しい赤に変えて緊迫感を出す（高さは維持）
      - time: 34
        event: ocean
        value: 6.0, 0.65, 0.06, 0.06

