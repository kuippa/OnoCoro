---
# 京都舞鶴 - 解体廃棄物シミュレーション（PLATEAU CityHack 2026）
#
# プレゼン動画用の一本道構成。高潮による浸水 → 地震と火災 → 巨大猫の解体 と進み、
# リザルトで廃材を可燃／不燃に分けて 4t トラック換算で見せる。
#
# デモの尺に収めるため 1 年のみ有効。year 2 以降を使うときはコメントを外す。
#
# 舞鶴は港湾都市で、津波浸水想定区域・土砂災害警戒区域・洪水浸水想定区域を含む。
# ただし対応するイベントが未実装のため、本 YAML では扱っていない。
stagename: 京都舞鶴
stagenotice: "港湾都市 解体廃棄物シミュレーション"
stageid: KyotoMaizuru
ver: 0.1.0 # 2026/8/29 CityHack 2026 初版
stages:
  - name: 京都舞鶴
    note: "建物の解体で出る廃棄物量を可視化する"
    # [未調整] 実際にプレイして決めること
    BIT: 1200
    CLK: 1200
itemlists:
  - item: WaterTurret   # 消火器
  - item: Hydrant       # 消火栓
  - item: Cistern       # 防火水槽

# ===== 巨大猫の移動経路 =====
# [暫定] 道に沿っていないので要調整。
# Unity 上でマーカーを動かせばそちらが優先される
# （同名マーカーがシーンにある場合、YAML は位置のみ更新する）。
#
# Y の auto は地面の高さを Raycast で自動検出する。
# 起伏があるので手で数値を入れるより auto のままが安全。
pathmakers:
  - name: path_marker_start
    pos: 41, auto, 422     # 猫の出発点

  - name: path_marker_01
    pos: 74, auto, 305     # 中間地点

  - name: path_marker_goal
    pos: 210, auto, -150   # ゴール（ここに着くと猫は消える）

# ===== 解体廃棄物の係数 =====
#   type                 : 建物種別（wood / steel / concrete / unknown）
#   tons_per_sqm         : 延床面積あたりの廃棄物発生量[t/㎡]
#   debris_per_ton       : 廃棄物あたりの瓦礫の量（見た目だけに効く）
#   max_cubes            : 1 棟あたりの瓦礫キューブ数の上限（負荷の安全弁）
#   noncombustible_ratio : 廃棄物のうち不燃物の割合。処理先も費用も異なるため分けて数える
#
# [出典] 原単位と組成比は PLATEAU 技術資料 plateau_tech_doc_0015
#   「5.7 災害廃棄物発生量の採用原単位」による。
#   横浜市災害廃棄物処理計画／環境省 災害廃棄物対策指針 技術資料に準拠。
#   木造でも不燃の割合が高いのは、重量比ではコンクリート殻・基礎・土砂が
#   支配的なため。見た目の体積比とは一致しない。
#
# [未対応] 資料にある「焼失」は被害要因別の区分。
#   本システムは構造別のみで判定しているため、火災倒壊した建物には適用していない。
#
# [重要] つまみの役割が違う。混ぜて使うと数字か見た目のどちらかが壊れる。
#   ・トラック台数など発表で出す数字を変えたい → tons_per_sqm
#   ・画面の瓦礫を増やしたいだけ               → debris_per_ton と max_cubes
#   tons_per_sqm を見た目のために盛ると、廃棄物量とトラック台数まで一緒に嘘になる。
#
# [注意] max_cubes に達すると、他をいくら増やしても見た目は変わらない。
#   打ち切り時は Console に警告が出る。
#
# ※ 建物種別は PLATEAU の耐火構造種別・階数・用途地域から推定している
demolition:
  - type: wood        # 木造
    tons_per_sqm: 0.6
    debris_per_ton: 20
    max_cubes: 1000
    noncombustible_ratio: 0.89
  - type: steel       # 鉄骨造 → 資料の「非木造」として扱う
    tons_per_sqm: 1.0
    debris_per_ton: 20
    max_cubes: 1000
    noncombustible_ratio: 0.89
  - type: concrete    # RC / SRC 造 → 資料の「非木造」として扱う
    tons_per_sqm: 1.0
    debris_per_ton: 20
    max_cubes: 1000
    noncombustible_ratio: 0.89
  - type: unknown     # 不明 → 住宅地が多いので木造相当を採用
    tons_per_sqm: 0.6
    debris_per_ton: 20
    max_cubes: 1000
    noncombustible_ratio: 0.89

# ===== 浸水による建物被害 =====
# 水面より depth 以上深く沈んだ建物を、duration 秒続いたら倒壊させる。
# 倒壊処理は building_break と同じ。
#
# [重要] max_breaks_per_second は倒壊の「速さ」の安全弁。
#   潮位を大きく上げると多数の建物が同時に条件を満たすため、上限が無いと一気に壊れる。
#   じわじわ壊れていく絵になるので演出としても都合がよい。
#
# [重要] debris は倒壊の「総量」の安全弁。倒壊した建物からはゴミキューブが
#   生成され、消えずに蓄積して FPS を落とす。
#   浸水は水中で瓦礫が見えないため、出さなくても絵は成立する。
#
# このセクションが無いステージでは浸水判定そのものが動かない。
flood:
  - depth: 0.5                # 水面からこの深さ[m]より下に底面があれば水没
    duration: 5.0             # 水没がこの秒数続いたら倒壊
    max_breaks_per_second: 10
    debris: false             # 浸水倒壊では瓦礫を出さない（負荷対策）

# goals / gameovers は定義しない（全年の完走がシミュレーション終了条件）

# 年に依存しない初期設定イベント（ステージ開始時に1回だけ実行）
events:
  - time: 0
    event: weather
    value: sunny, 0.00, 0.30, 500  # 天候タイプ, 雨の強さ, 雲の強さ, 霧の視界
  - time: 0
    event: wind
    value: 7, 300  # 風速, 風向き（西北西・日本海側の冬季卓越風向）

  # 海面の初期高さ。
  # [注意] watersurface イベントは Ocean / River などを束ねる親を動かすもので、
  #   海面の高さではない。海面を動かすのは ocean イベント。
  #     value: 高さ                             → 高さだけ変える
  #     value: 高さ, 秒数                       → その秒数をかけてなめらかに変える
  #     value: 高さ, R, G, B                    → 海面の色も変える
  #     value: 高さ, R, G, B, 吸収距離          → 濁り具合も変える（小さいほど濁る）
  #     value: 高さ, R, G, B, 吸収距離, 秒数    → 色と濁りは即時、高さだけ時間をかける
  #
  # [浸水の見せ方] 既定の海面は透明度が高く浸水範囲が判別しにくい。
  #   吸収距離を小さくすると濁って不透明になり、どこが浸かっているか一目で分かる。
  - time: 0
    event: ocean
    value: 0.7

  # ===== 解体の単体テスト用（試すときだけコメントを外す）=====
  # building_demolish: 建物を N 棟解体して更地化し、跡地に瓦礫を散布する。
  # Console に [Demolition] とトラック換算のサマリーが出る。
  # [注意] value: "all" は全建物が対象になり確実に固まるので、このマップでは使わない。
  # - time: 5
  #   event: building_demolish
  #   value: "3"

# baseline = 消火なし時の想定火災延焼棟数（防いだ延焼 = baseline - 実延焼）。
# [未計測] 消火ユニットを置かずに完走し、実際の延焼棟数で置き換えること。
# 未指定の年は地震倒壊数から推定する。
# 投資が発生しないステージではリザルトに ROI を出さないため、本デモでは影響しない。
years:
  - year: 1
    duration: 180
    note: "高潮 → 地震火災 → 巨大猫。プレゼン動画用の一本道構成"
    # 火災が鎮火すると年を自動終了する既定動作を切る。
    # 猫の登場は火が消えたあとなので、有効のままだと演出の途中で年が終わる
    auto_end: false
    baseline: 4
    schedule:
      # 浸水を見せてから地震を起こす。パターン内部でも数秒の間があるため、
      # 実際の発生は at より少し後になる
      - pattern: quake_fire
        at: 40
        intensity: "1.6"
        break_count: "5"
    events:
      - time: 1
        event: telop
        value: "Year 1: 高潮が押し寄せる"

      # --- 導入: 潮位を上げて低地から浸水させる ---
      - time: 3
        event: subtelop
        value: "高潮警報。低地の建物が浸水しています"
      # 秒数を指定して潮位をなめらかに上げる。
      # 時刻を刻んで少しずつ上げるより滑らかに見える。
      # 最初の一段で濁らせて、浸水範囲が見えるようにする
      - time: 4
        event: ocean
        value: 0.8, 0.18, 0.22, 0.16, 0.8, 6
      - time: 11
        event: ocean
        value: 1.1, 20

      # --- 中盤: 地震と火災（上の schedule で発生する）---

      # --- 終盤: 海から巨大猫が現れて建物を解体していく ---
      - time: 90
        event: bloom_path
        value: path_marker_start, path_marker_01, path_marker_goal
      - time: 100
        event: telop
        value: "海から巨大な影が…"
      # 海面を毒々しい赤に変えて緊迫感を出す（高さは維持）
      - time: 101
        event: ocean
        value: 1.1, 0.65, 0.06, 0.06, 0.3
      - time: 102
        event: spawn_enemy_unit
        value: Cat, path_marker_start, path_marker_01, path_marker_goal
      - time: 105
        event: subtelop
        value: "通り道の建物が次々と解体されていく"

      - time: 150
        event: weather
        value: rain, 0.65, 0.75, 200  # 天候タイプ, 雨の強さ, 雲の強さ, 霧の視界
